  - id: task-1894
    title: Полная доработка CargoPlanner — взять существующий код как основу,
      исправить все ошибки и добавить недостающие функци...
    description: >-
      Полная доработка CargoPlanner — взять существующий код как основу,
      исправить все ошибки и добавить недостающие функции, не переписывая всё с
      нуля.


      ИСПРАВИТЬ КОНКРЕТНЫЕ ПРОБЛЕМЫ (12 пунктов):

      1. Грузы отображаются за пределами кузова — все размещённые грузы должны
      строго находиться внутри кузова. Проверить алгоритм упаковки (packer.ts) и
      преобразование координат в Scene3D.

      2. Невозможно перемещать грузы в 2D-схеме — реализовать drag-and-drop для
      грузов в 2D-сцене; перемещение должно обновлять раскладку и пересчитывать
      метрики.

      3. Режимы «Вдоль» и «Смешанный» дают одинаковый результат — алгоритмы
      должны давать разные раскладки: Вдоль — все грузы ориентированы вдоль оси
      X; Поперёк — все ориентированы поперёк (поворот 90°); Смешанный —
      комбинированная ориентация (оптимальный выбор для каждого груза).

      4. В режиме «Поперёк» грузы не помещаются — исправить алгоритм, чтобы
      грузы корректно упаковывались с учётом поворота.

      5. В модалке «Умный подбор автомобиля» нет скролла — добавить вертикальную
      прокрутку.

      6. В 2D-виде нет управления слоями — добавить кнопки переключения слоёв по
      высоте (аналогично 3D).

      7. По умолчанию должен показываться 2D-вид, а не 3D — сделать 2D основным
      с возможностью переключения на 3D.

      8. В форме добавления цилиндрического груза лишнее поле «Высота» — для
      цилиндра показывать только «Длина» (по оси X) и «Диаметр» (ширина и
      высота), поле «Высота» скрыть.

