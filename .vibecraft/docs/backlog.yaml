      визуальные ошибки. Цель: полностью устранить все выявленные проблемы,
      сделать приложение надёжным и пригодным для профессионального
      использования логистами.


      ЛОГИКА ГАБАРИТОВ: ОБЫЧНЫЙ И НЕГАБАРИТНЫЙ ГРУЗ:

      Обычный груз (isOversize === false) никогда не выходит за пределы кузова —
      ни по длине, ни по ширине, ни по высоте. Если в столбце суммарная высота
      грузов превышает высоту кузова — последний груз не размещается в этот
      столбец (идёт на пол в другое место или остаётся неразмещённым). Контроль
      высоты на каждом шаге: position.y + height ≤ vehicle.height. Работает
      независимо от штабелирования (даже при макс. слоёв = 1 груз не должен
      «улетать» вверх).

      Негабаритный груз (isOversize === true) может выходить за пределы кузова,
      но только если явно помечен как негабарит. Ставится на пол кузова (нижняя
      грань на уровне пола) или на допустимую опору. Визуально выделяется
      (другой цвет, пунктирная обводка, значок «⚠ негабарит»). В метриках
      учитывается отдельно: «Размещено обычных: X, негабарит: Y». В подсказках:
      «Негабаритный груз выходит за габариты кузова — проверьте возможность
      перевозки».

      Алгоритм упаковки (packer.ts): перед размещением груза проверять
      itemHeight (высота или диаметр для цилиндра); если не isOversize и
      (position.y + itemHeight > vehicle.height, или position.x + itemLength >
      vehicle.length, или position.z + itemWidth > vehicle.width) — не
      размещать. Для штабелирования проверять высоту столбца с учётом макс.
      количества слоёв и высоты кузова.


      ЛОГИКА РЕЖИМОВ РАСКЛАДКИ:

      Каждый режим считается независимо и даёт свой уникальный результат: Вдоль
      — все грузы ориентированы вдоль оси X; Поперёк — все повёрнуты на 90°
      (длина по ширине кузова); Смешанный — для каждого груза выбирается
      оптимальная ориентация.

      Смена зазоров не должна менять активный режим автоматически. Активный
      режим меняется только по клику на вкладку.

      Грузы не пропадают при увеличении зазоров. Если зазор слишком велик — либо
      уменьшается эффективный зазор до допустимого (с уведомлением), либо
      показывается тост «Максимальный зазор для этого режима: X мм» и значение
      откатывается.

      Максимальные зазоры вычисляются для каждого режима отдельно
      (findMaxGapByType(mode, type)). При переключении режима — пересчитывать
      максимумы и валидировать текущие значения зазоров.

      Все три режима корректно работают с любыми комбинациями грузов
      (прямоугольные + цилиндры, разные размеры/веса, со штабелированием и без,
      с зазорами и без).

      Лучший режим определяется по заполнению объёма (максимум); если равны — по
      количеству размещённых, затем — по меньшим габаритам укладки.

      Метрики для каждого режима должны быть разными (если раскладки разные):
      количество размещённых, заполнение объёма и веса, габариты укладки,
      возможность штабелирования.


      ПРОБЛЕМЫ В 3D:

      Убрать фокус камеры на груз по клику — неудобно и сбивает с толку.


      ПРОБЛЕМЫ В 2D (drag-and-drop):

      Полностью переработать механизм перетаскивания:

      - Проверка коллизий: груз нельзя поместить в место, где он пересекается с
      другим грузом на том же слое. При попытке — возврат в исходное положение +
      тост «Пересечение с грузом «Имя»».

      - Ограничение границами кузова: X ∈ [0, длина], Z ∈ [0, ширина]. Попытка
      выхода — возврат + тост.

      - Смена слоя: возможность изменить слой (высоту) груза через контекстное
      меню или поле ввода. Проверка коллизий и высоты кузова на новом слое.

      - Корректные габариты: в 2D-схеме габариты раскладки должны отображаться
      целыми мм (без длинных дробей типа 2044.6214294433594).


      ШТАБЕЛИРОВАНИЕ:

      - Убрать поле «Ограничение высоты» (высота уже ограничена кузовом).

      - Добавить поле «Максимальное количество слоёв» (пользователь сам
      указывает: 1, 2, 3…). Минимум 1 (штабелирование выключено). Максимум
      вычисляется автоматически = floor(высота кузова / высота самого низкого
      груза). При попытке ввести больше — откат + тост «Максимум слоёв для этого
      кузова: N».

      - Алгоритм упаковки не ставит больше грузов друг на друга, чем указано.
      Суммарная высота столбца не превышает высоту кузова.

      - Правила штабелирования: груз можно ставить только на груз с stackable:
      true, с проверкой maxLoad, совместимости по форме (прямоугольный на
      прямоугольный, цилиндр на цилиндр той же ориентации) и группе
