      и похожие. Причина: в .bat файле есть кириллица в кодировке, которую
      командная строка Windows (cmd) неправильно парсит, из-за чего многословные
      русские сообщения разваливаются на фрагменты и исполняются как отдельные
      команды.


      Требования к исправленному launch.bat:

      - Содержимое файла должно быть ПОЛНОСТЬЮ ASCII (только латинские буквы,
      цифры, символы и английские слова). Никакой кириллицы внутри файла вообще
      быть не должно — чтобы cmd корректно парсил его в любой локали и
      кодировке.

      - Заголовок окна «CargoPlanner — launch».

      - Переходить в папку скрипта через `cd /d "%~dp0"`.

      - Проверять наличие Node.js (команда `where node >nul 2>nul`), при
      отсутствии выводить понятное английское сообщение «Node.js not found.
