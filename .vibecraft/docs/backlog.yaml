      Правило: любое числовое поле должно иметь диапазон [min, max]. При вводе
      вне диапазона — откат к предыдущему значению + тост с указанием диапазона.
      При редактировании существующих записей — та же валидация.


      РЕАЛЬНЫЕ ГЛОБАЛЬНЫЕ ОГРАНИЧЕНИЯ:

      Автомобиль (грузовой отсек): Длина min 1500 мм / max 53500 мм; Ширина min
      1200 / max 10000; Высота min 300 / max 8000; Грузоподъёмность min 100 кг /
      max 500000 кг. Если грузоподъёмность = 0 — считать «не ограничена». При
      превышении суммарного веса грузов над грузоподъёмностью — предупреждение
      (тост), но разрешить продолжить.

      Груз: Длина min 100 / max 53500 мм; Ширина min 100 / max 10000; Высота min
      100 / max 8000; Диаметр (цилиндр) min 100 / max 9500; Вес min 10 кг / max
      500000 кг; Количество min 1 / max 10000; Макс. нагрузка сверху min 0 / max
      500000 кг. Габариты груза не могут превышать габариты кузова (кроме
      isOversize). Вес груза не может превышать грузоподъёмность
      (предупреждение).

      Зазоры: gapWalls/gapWidth/gapLength min 0 мм / max вычисляется через
      findMaxGapByType. При вводе > maxGap — откат к предыдущему + тост.
      Отрицательные значения запрещены. При переключении режима загружать
      сохранённые зазоры, но проверять на максимум для нового режима; если
      превышает — обрезать до максимума + тост.


      ШТАБЕЛИРОВАНИЕ (КРИТИЧЕСКИ ВАЖНО):

