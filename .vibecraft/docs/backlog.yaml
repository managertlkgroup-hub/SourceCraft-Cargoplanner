      - Если папки node_modules нет — выполнять `npm install`, при ошибке
      выводить английское сообщение и завершать с паузой.

      - Затем запускать `npm run dev` и выводить английскую подсказку, что
      сервер будет доступен в браузере по адресу http://localhost:3000.

      - В конце иметь паузу, чтобы окно не закрылось при ошибке (например,
      финальный блок `pause`).


      Не менять ничего в остальном коде приложения — только переписать
      содержимое файла launch.bat.
