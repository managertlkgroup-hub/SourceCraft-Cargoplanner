  - id: task-1755
    title: Настройка зазоров и штабелирования
    description:
      "Три типа зазоров — от стен, между рядами по ширине, между рядами
      по длине — задаются в мм, применяются к раскладке и сохраняются отдельно
      для каждого режима (восстанавливаются при переключении). Валидация:
      значение не превышает максимально допустимое, при превышении — откат к
      предыдущему значению и тост; отрицательные значения запрещены. Шаг
      стрелочек: мм→10, см→1, м→0.001. Штабелирование в несколько слоёв с
      ограничением высоты, проверкой опоры (груза со свойством stackable),
      совместимости (прямоугольный на прямоугольный, цилиндр на цилиндр той же
      ориентации) и максимальной нагрузки сверху (maxLoad)."
    status: completed
    acceptance_criteria:
      - Пользователь может включить зазоры и задать три значения, которые
        применяются к раскладке
      - Значения зазоров сохраняются отдельно для каждого режима и
        восстанавливаются при переключении
      - Недопустимые значения (отрицательные или превышающие максимум)
        отклоняются с подсказкой
      - Пользователь может включить штабелирование с ограничением высоты, грузы
        укладываются в слои с учётом опоры, совместимости и нагрузки
    summary:
      "Реализованы настройки зазоров и штабелирования. Три зазора (от стен,
      между рядами по ширине/длине) задаются в мм, применяются к раскладке и
      хранятся отдельно для каждого режима; валидация отклоняет отрицательные и
      превышающие максимум значения с откатом и тостом, шаг стрелочек зависит от
      единиц (мм→10, см→1, м→0.001). Добавлено штабелирование с тумблером и
      ограничением высоты: упаковка учитывает опору (stackable), совместимость
      (прямоугольник на прямоугольник, цилиндр на цилиндр той же ориентации) и
      нагрузку сверху (maxLoad). Основная реализация — lib/packing.ts и
      components/cargo-planner.tsx."
