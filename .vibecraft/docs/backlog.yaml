      бы быть помещены на новый слой.

      - Если пользователь указал maxLayers = 2 и грузы размещены в 2 слоя —
      подсказка не должна предлагать «второй слой».

      - Умная подсказка anyGap = gapsEnabled && (walls + width + length) > 0.
      Фраза «или уменьшите зазоры» — только если anyGap === true.

      - «Малое заполнение объёма» (а не «Низкое»).

      - Не предлагать добавить грузы, если они не помещаются.

      - Не предлагать распределить вес, если это не изменит загрузку.


      ПРЕСЕТЫ (критично):

      Проблемы: встроенные пресеты грузов нельзя редактировать и удалять;
      пресеты авто не редактируются (только выбор из списка).

      Требование:

      Пресеты грузов (диалог «Пресеты»): открывается по кнопке «Пресеты».
      Включает встроенные (европаллет, финпаллет, бочки, ящик, мешок, рулон) и
      пользовательские. Встроенные пресеты нельзя удалить, но можно
      редактировать (изменённая версия сохраняется как пользовательская с
      пометкой «изменён»). Пользовательские пресеты — редактировать, удалять,
      добавлять. Возможность сбросить встроенный пресет к дефолтным значениям.

      Пресеты авто (аналогично грузам): кнопка «Пресеты авто» открывает диалог
      со списком: встроенные (ГАЗель Бизнес, ГАЗель NEXT, Бычок, ЗИЛ-5301,
      КамАЗ-4308, КамАЗ-65117, Еврофура, Jumbo) и пользовательские —
      добавляются, редактируются, удаляются. Встроенные авто — можно
      редактировать (сохраняется как пользовательский с пометкой «изменён»),
      сбросить к дефолту. Выбор авто — через этот диалог или через выпадающий
      список в основной панели.


      СОХРАНЕН��Е СОСТОЯНИЯ (сессии) — КРИТИЧНО:

      Сессии не сохраняются, две отдельные кнопки («Сохранить» и «Загрузить») —
      неудобно.

      Требование:

      1. Язык, тема, единицы — сохраняются мгновенно.

      2. Автомобиль, грузы, активный режим — сохраняются вручную.

      3. ОДНА кнопка «Сессии» (не две!). Открывает модальное окно с двумя
      вкладками: «Сохранить» — поле для имени + кнопка «Сохранить»; «Загрузить»
      — список всех сохранённых сессий с именами, датами, кнопками
      «Загрузить»/«Удалить».

      4. Сессии реально сохраняются в localStorage (ключ mlp:sessions). После
      перезагрузки — список восстанавливается.

      5. При загрузке сессии: восстанавливаются автомобиль, грузы, активный
      режим; зазоры сбрасываются к нулю; тема/язык/единицы остаются текущими;
      раскладка пересчитывается автоматически.

      6. Структура сессии: { id, name, createdAt, vehicleId, cargo,
      activeVariant }.

      7. Удаление — с подтверждением.

      8. Максимум 50 сессий, при превышении — предупреждение.


      УМНЫЙ ПОДБОР АВТОМОБИЛЯ (критично):

      Проблемы: не указывается, какие именно грузы не влезают в ТС (в любом
      режиме); нет сортировки (только «по объёму убыв.»).

      Требование:

      1. Для каждого автомобиля показывать: количество размещённых (из общего);
      заполнение объёма (%) и веса (%); габариты укладки и объём/вес;
      возможность штабелирования (Да/Нет); список грузов, которые не помещаются
      (в любом режиме) — выделить жёлтым (например: «⚠ Не помещаются: Бочка × 3,
      Ящик × 2»). Если груз не влезает хотя бы в один режим — пометить
      автомобиль как «Не подходит для N грузов» (жёлтым).

      2. Сортировка — настраиваемая пользователем: выпадающий список: «По объёму
      (убыв.)», «По объёму (возр.)», «По весу (убыв.)», «По весу (возр.)», «По
      габаритам (убыв.)», «По габаритам (возр.)», «По количеству размещённых
      (убыв.)».

      3. Кнопка «Выбрать» — применяет автомобиль и пересчитывает раскладку.

      4. Скролл в модалке.


      ВАЛИДАЦИЯ И ОГРАНИЧЕНИЯ ВЕЗДЕ:

      Единая функция validateField(name, value) для всех числовых полей.

      Диапазоны: Длина кузова 1500–53500 мм; Ширина кузова 1200–10000; Высота
      кузова 300–8000; Грузоподъёмность 100–500000 кг (0 = не ограничена); Длина
      груза 100–53500 мм; Ширина груза 100–10000; Высота груза 100–8000; Диаметр
      (цилиндр) 100–9500; Вес груза 10–500000 кг; Количество 1–10000; Макс.
      нагрузка сверху 0–500000 кг; Зазоры 0 мм до maxGap (вычисляется).

      При вводе вне диапазона — откат к предыдущему + тост. При редактировании —
      та же валидация. Обычный груз не может превышать габариты кузова.
      Негабаритный груз — может, но помечается.


      ПРЕСЕТЫ АВТО И ГРУЗОВ — РЕАЛЬНЫЕ ЗНАЧЕНИЯ:

      Авто: ГАЗель Бизнес (3089×1978×400, 1.5 т), ГАЗель NEXT (3700×2000×2000,
      1.7 т), Бычок (3500×2000×500, 3 т), ЗИЛ-5301 (3750×2100×600, 3 т),
      КамАЗ-4308 (6000×2400×2400, 7.5 т), КамАЗ-65117 (7700×2470×2800, 15 т),
      Еврофура (13600×2450×2700, 20 т), Jumbo (13600×2450×3000, 25 т).

      Грузы: Европаллет (1200×800×144, 25 кг), Финпаллет (1200×1000×145, 21 кг),
      Бочка 200л металл (620×620×875, 9 кг, цилиндр), Бочка 200л пластик
      (675×675×705, 9 кг, цилиндр), Ящик (600×400×400, 20 кг), Мешок 50кг
      (800×500×300, 50 кг), Рулон (1500×400×400, 80 кг, цилиндр).


      ЭКСПОРТЫ:

      - PDF — параметры авто, метрики, зазоры, грузы, 2D-схемы, инструкция.

      - PNG — снимок текущего вида (2D или 3D), с метриками.

      - Excel — параметры, грузы, зазоры, все варианты.

      - Все работают без ошибок.


      ИНТЕРФЕЙС:

      - По умолчанию 2D-вид, кнопка 2D первая.

      - Легенда управления в 2D и 3D.

      - Убрать горизонтальный скролл в левой панели.

      - Убрать синюю кнопку без текста.

      - У цилиндра нет поля «Высота» — только «Длина» и «Диаметр».

      - При редактировании груза форма заполняется.

      - Подсказка «Малое заполнение объёма».

      - Скролл в модалке подбора.

      - Корректные габариты в 2D (целые мм).

      - Подписи размеров в 2D — длина сверху/снизу по центру, ширина
      слева/справа по центру.


      CSV-ИМПОРТ/ЭКСПОРТ:

      Каждая строка проходит валидацию (через validateField). Некорректные
      отбрасываются с уведомлением.


      ДОПОЛНИТЕЛЬНЫЕ ПРОБЛЕМЫ:

      1. Гидратация: см. выше.

      2. Смешанный режим: в lib/packing.ts для mixed перебирать все возможные
      ориентации для каждого груза.

      3. findMaxGapByType: переписать с учётом размеров грузов (а не только
