      ГЛОБАЛЬНОЕ ТРЕБОВАНИЕ: ОГРАНИЧЕНИЯ ВЕЗДЕ

      Сейчас в приложении нет ограничений — можно вводить любые числа
      (отрицательные, нулевые, гигантские), грузы выходят за кузов, зазоры можно
      увеличивать до бесконечности, штабелировать сколько угодно слоёв. Это
