version: 1
tasks:
  - id: task-1584
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения CargoPlanner со статическими
      данными-заглушками: каркас интерфейса — верхняя панель (логотип,
      переключатели темы/языка/единиц, кнопки экспорта), левая панель (выбор
      автомобиля, таблица грузов), центральная область 3D-сцены с переключением
      на 2D, правая панель метрик и подсказок, нижняя панель вкладок режимов
      (вдоль/поперёк/смешанный) и настроек зазоров.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные страницы и логику упаковки реализовывать не нужно.
    status: completed
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - "Видны основные области интерфейса: верхняя панель, панели автомобиля и
        грузов, центральная область 3D/2D, панель метрик, вкладки режимов и
        зазоров"
    summary:
      "Реализована визуальная заглушка главной страницы CargoPlanner: верхняя
      панель (логотип, переключатели темы/языка/единиц, кнопки экспорта), левая
      панель (выбор автомобиля и таблица грузов), центральная область 3D/2D
      сцены, правая панель метрик и подсказок, нижняя панель вкладок режимов и
      настроек зазоров. Основная реализация — components/cargo-planner.tsx,
      данные — lib/data.ts. Статическая сборка проходит без ошибок."
  - id: task-9864
    title: "Планирование загрузки: таблица грузов и выбор автомобиля"
    description: "Реализовать список грузов (прямоугольные и цилиндрические) с
      добавлением, редактированием и удалением через форму. Пресеты грузов:
      европаллет, финпаллет, бочки. Выбор автомобиля из пресетов (ГАЗель, Бычок,
      ЗИЛ, КамАЗ, Фура) или создание собственного кузова с произвольными
      размерами. CSV-импорт и экспорт списка грузов. Проверка веса и габаритов."
    status: completed
    acceptance_criteria:
      - Пользователь может добавить, отредактировать и удалить прямоугольные и
        цилиндрические грузы
      - Доступны пресеты грузов (европаллет, финпаллет, бочки)
      - Пользователь может выбрать автомобиль из пресетов или создать
        собственный кузов
      - Работает импорт и экспорт списка грузов в CSV
    summary: "Реализована таблица грузов: добавление, редактирование и удаление
      прямоугольных и цилиндрических грузов через форму с валидацией (zod),
      пресеты (европаллет, финпаллет, бочка), выбор автомобиля из пресетов
      (ГАЗель, Бычок, ЗИЛ, КамАЗ, Фура) или создание собственного кузова с
      произвольными размерами, импорт/экспорт списка грузов в CSV. Основная
      реализация — components/cargo-planner.tsx, формы — cargo-form-dialog.tsx и
      custom-vehicle-dialog.tsx, данные/CSV-хелперы — lib/data.ts."
  - id: task-6234
    title: Автораскладка в трёх режимах с метриками
    description: "Реализовать алгоритм упаковки грузов в кузов для трёх режимов:
      вдоль, поперёк, смешанный. Для каждой позиции рассчитывается раскладка,
      выбирается лучший вариант по заполнению объёма. Отображаются метрики:
      количество размещённых/всего грузов, заполнение объёма и веса (%), общий
      вес, свободные объём и вес, габариты укладки, возможность штабелирования,
      список неразмещённых грузов. Упаковка до 100 грузов выполняется менее чем
      за 1 секунду."
    status: completed
    acceptance_criteria:
      - Для каждого из трёх режимов (вдоль, поперёк, смешанный) рассчитывается
        раскладка
      - Выбирается лучший вариант по заполнению объёма
      - "Отображаются все метрики: размещено/всего, заполнение объёма и веса,
        общий вес, свободные объём и вес, габариты укладки, возможность
        штабелирования, список неразмещённых грузов"
      - Упаковка 100 грузов занимает менее 1 секунды
    summary: "Реализован алгоритм автораскладки в трёх режимах (вдоль, поперёк,
      смешанный) с послойной упаковкой, учётом зазоров, ограничения веса и
      штабелирования. Для каждого режима рассчитывается раскладка и выбирается
      лучшая по заполнению объёма (бейдж «Лучший»). Отображаются все метрики:
      размещено/всего, заполнение объёма и веса, общий вес, свободные объём и
      вес, габариты укладки, штабелируемость, список неразмещённых грузов.
      Упаковка 100 грузов выполняется за ~1–3 мс. Основная реализация —
      lib/packing.ts, интеграция — components/cargo-planner.tsx."
