      совместимости: прямоугольный на прямоугольный, цилиндр на цилиндр той же
      ориентации. Проверка группы совместимости (compatibilityGroup). Если
      условия не выполняются — груз ставится на пол (или не размещается).


      ПЕРЕМЕЩЕНИЕ В 2D (drag-and-drop):

      - Границы кузова: груз нельзя вытащить за пределы (X ∈ [0, длина], Z ∈ [0,
