      6. Пресеты авто: добавить кнопки редактирования/удаления для встроенных.

      7. Подсказки о слоях: учитывать maxLayers.

      8. CSV-импорт: прогонять через validateField.

      9. Негабаритные грузы: использовать isOversize для разрешения выхода за
      габариты.


      ВОССТАНОВИТЬ ПРЕИМУЩЕСТВА ОРИГИНАЛА (если потеряно):

      - Продвинутый алгоритм упаковки (packer.ts) — крайние точки, цилиндры,
