      высотой кузова).

      - Добавить поле «Максимальное количество слоёв» — пользователь сам
      указывает, сколько грузов можно поставить друг на друга (1, 2, 3, …). По
      умолчанию 1 (штабелирование выключено). Минимум 1. Максимум вычисляется
      автоматически = floor(высота кузова / высота самого низкого груза). При
